<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Page Not Found | VisionX Coders</title>
    <meta name="robots" content="noindex"/>
    <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/style.css"/>
    <script>(function(){try{if(localStorage.getItem("visionx-theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}})();</script>
    <style>
      .page404{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 24px;flex-direction:column}
      .page404-code{font-family:"Poppins",sans-serif;font-size:clamp(80px,15vw,160px);font-weight:900;line-height:1;background:linear-gradient(135deg,#c2410c,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0}
      .page404-icon{font-size:56px;margin:8px 0 20px}
      .page404-title{font-family:"Poppins",sans-serif;font-size:clamp(22px,4vw,36px);font-weight:800;color:var(--heading);margin-bottom:14px}
      .page404-sub{font-size:16px;color:var(--muted);max-width:440px;line-height:1.7;margin-bottom:36px}
      .page404-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
      .page404-btns a{padding:12px 28px;border-radius:10px;font-family:"Poppins",sans-serif;font-weight:700;font-size:14px;text-decoration:none;transition:transform .2s ease}
      .page404-btns a:hover{transform:translateY(-2px)}
      .btn-home{background:linear-gradient(135deg,#c2410c,#f97316);color:#fff}
      .btn-contact{border:2px solid #f97316;color:#c2410c}
      html.dark .btn-contact{color:#f97316}
    </style>
  
    <!-- Google Analytics 4 -->
    <!-- STEP: Replace G-XXXXXXXXXX with your real GA4 Measurement ID -->
    <!-- Get it free at: https://analytics.google.com → Admin → Data Streams -->

      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());
      gtag("config", "G-XXXXXXXXXX");
    </script> -->
  </head>
  <body>
    <div id="site-header"></div>
    <main class="page404">
      <div class="page404-code">404</div>
      <div class="page404-icon">🔍</div>
      <h1 class="page404-title">Oops! Page Not Found</h1>
      <p class="page404-sub">The page you are looking for does not exist or may have been moved. Let us get you back on track!</p>
      <div class="page404-btns">
        <a href="index.html" class="btn-home">🏠 Back to Home</a>
        <a href="courses.html" class="btn-contact">🎓 View Courses</a>
        <a href="contact.html" class="btn-contact">📞 Contact Us</a>
      </div>
    </main>
    <div id="site-footer"></div>
    <script src="js/main.js"></script>
  </body>
</html>
